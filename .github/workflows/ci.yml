name: CI

# PRs and pushes run the full test suite + a Release build.
# A push to `main` additionally archives and ships the build to TestFlight
# (the `deploy` job), versioned from the latest `vX.Y.Z` tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede in-progress PR runs, but never a `main` run — that one may be
  # mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SIMULATOR_NAME: iPhone 17 Pro

jobs:
  test:
    name: Build & test
    # The project pins iOS 27 as its deployment target and uses unguarded iOS 27
    # APIs, so it needs the iOS 27 SDK. `xcode-27` is currently the only hosted
    # image that ships it — macos-26 tops out at Xcode 26.6. It is a preview
    # image; see README notes.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Installs the tuist version pinned in .mise.toml.
      - name: Install pinned tools
        uses: jdx/mise-action@v2

      # Xcode 26+ ships the Metal toolchain as a separate download; the hosted
      # image omits it and DesignComponents has a .metal shader.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # Only the SwiftPM mirror cache, deliberately not Tuist/.build: Tuist restores
      # pins from its own state, and a partially restored .build can resolve to
      # versions that disagree with the committed Package.resolved.
      - name: Cache SwiftPM clones
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: swiftpm-

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
          tuist version

      - name: Resolve dependencies
        run: tuist install

      # Booting up front keeps the first test bundle from racing a cold simulator.
      # A failed boot is not fatal — the test run will boot it itself.
      - name: Boot simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next((v['udid'] for k,vs in d.items() if 'iOS-27' in k for v in vs if v['name']=='${SIMULATOR_NAME}'),''))")
          if [ -n "$udid" ]; then xcrun simctl boot "$udid" || true; fi
          xcrun simctl list devices booted

      # The `Mooligan` scheme aggregates every test target: the per-module *Tests
      # bundles, MooliganTests (logic) and MooliganSnapshotTests (renders views
      # and diffs them against Mooligan/SnapshotTests/__Snapshots__).
      # `--skip-ui-tests` drops MooliganUITests — it runs in the separate
      # `ui-test` job, which is slower and flakier so it gets its own retries.
      - name: Test (unit + snapshot)
        run: tuist test Mooligan --device "$SIMULATOR_NAME" --skip-ui-tests

      - name: Generate project
        run: tuist generate --no-open

      # Guards the #if DEBUG test doubles: if any production code reaches a mock,
      # this is the build that fails.
      - name: Release build
        run: |
          xcodebuild build \
            -workspace Mooligan.xcworkspace \
            -scheme Mooligan \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            ~/.local/state/tuist/**/logs.txt
          retention-days: 7
          if-no-files-found: ignore

  ui-test:
    name: UI tests
    needs: test
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tools
        uses: jdx/mise-action@v2

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache SwiftPM clones
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: swiftpm-

      - name: Resolve dependencies
        run: tuist install

      - name: Boot simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next((v['udid'] for k,vs in d.items() if 'iOS-27' in k for v in vs if v['name']=='${SIMULATOR_NAME}'),''))")
          if [ -n "$udid" ]; then xcrun simctl boot "$udid" || true; fi
          xcrun simctl list devices booted

      # The app launches with -uiTestMode (see Mooligan/Sources/UITestSupport.swift),
      # so these run fully offline against mock data. Retry flakes in place rather
      # than failing the job on the first miss.
      - name: UI tests
        run: |
          tuist test Mooligan \
            --device "$SIMULATOR_NAME" \
            --test-targets MooliganUITests \
            --no-selective-testing \
            -- -retry-tests-on-failure -test-iterations 3

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            ~/.local/state/tuist/**/logs.txt
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Archive & upload to TestFlight
    needs: [test, ui-test]
    # Only from main, on a merge (or a manual re-run of the workflow on main).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    timeout-minutes: 90
    # Never cancel an in-flight upload; queue instead. A cancelled altool run can
    # leave a half-uploaded build that App Store Connect rejects the retry of.
    concurrency:
      group: testflight
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the build number is the commit count since the
          # latest release tag.
          fetch-depth: 0

      - name: Install pinned tools
        uses: jdx/mise-action@v2

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache SwiftPM clones
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: swiftpm-

      # Marketing version = latest vX.Y.Z tag (the `v` is optional).
      # Build number  = commits since that tag, + 1, so the tagged commit is
      # build 1 and every later merge bumps it. Resets when a new tag lands,
      # which is fine — TestFlight only requires the build to increase *within*
      # a marketing version.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force --prune
          tag=$(git tag --list --sort=-v:refname \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$tag" ]; then
            marketing="0.1.0"
            build=$(git rev-list --count HEAD)
            echo "No release tag found — using $marketing ($build)."
          else
            marketing="${tag#v}"
            build=$(( $(git rev-list --count "${tag}..HEAD") + 1 ))
            echo "Latest tag $tag → $marketing ($build)."
          fi
          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: tuist install

      - name: Generate project
        run: tuist generate --no-open

      # An App Store Connect API key lets xcodebuild both fetch signing assets and
      # upload, so no certificate or profile has to be stored in the repository.
      - name: Write App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      # Fail in seconds with a precise message if a secret is wrong or the app
      # isn't registered, instead of ~15 minutes into the archive. Prints only
      # shapes and pass/fail, never the secret values.
      - name: Verify App Store Connect credentials
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: com.missingems.mooligan
        run: |
          set -uo pipefail
          key="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          fail=0

          echo "APP_STORE_CONNECT_KEY_ID    : ${#KEY_ID} chars"
          [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || echo "::warning::KEY_ID is not the usual 10 upper-alphanumeric chars"

          echo "APP_STORE_CONNECT_ISSUER_ID : ${#ISSUER_ID} chars"
          if [[ "$ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "  -> UUID shape (correct)"
          else
            echo "::error::APP_STORE_CONNECT_ISSUER_ID is not a UUID. It is the Issuer ID above the key list in App Store Connect > Users and Access > Integrations > Keys, NOT the Team ID."
            fail=1
          fi

          echo "APPLE_TEAM_ID               : ${#TEAM_ID} chars"
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || echo "::warning::APPLE_TEAM_ID is not the usual 10-char Team ID — is it swapped with the Issuer ID?"

          echo "P8 first line              : $(head -1 "$key" || true)"
          if ! head -1 "$key" | grep -q -- "-----BEGIN PRIVATE KEY-----"; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 is not a PEM key (missing header, or newlines flattened on paste). Re-set it: gh secret set APP_STORE_CONNECT_KEY_P8 < AuthKey_${KEY_ID}.p8"
            fail=1
          fi
          openssl pkey -in "$key" -noout 2>/dev/null || { echo "::error::openssl cannot parse the private key"; fail=1; }
          [ "$fail" = 0 ] || exit 1

          # Real auth: build a token from the key (altool --list-providers doesn't
          # accept API-key auth) and call the ASC API.
          jwt=$(xcrun altool --generate-jwt --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | grep -E '^eyJ' || true)
          if [ -z "$jwt" ]; then
            echo "::error::Could not build a token from the key — the .p8 does not match Key ID $KEY_ID."
            exit 1
          fi
          code=$(curl -s -o /tmp/asc.json -w '%{http_code}' -H "Authorization: Bearer $jwt" \
            "https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=${BUNDLE_ID}&limit=1")
          if [ "$code" != "200" ]; then
            echo "::error::App Store Connect returned HTTP $code. The API key is being rejected — check the Issuer ID and that the key is still active."
            cat /tmp/asc.json; exit 1
          fi
          if [ "$(jq -r '.data | length' /tmp/asc.json)" = "0" ]; then
            echo "::error::Authenticated OK, but no app with bundle id '${BUNDLE_ID}' exists in App Store Connect. Create the app record (bundle ids are case-sensitive)."
            exit 1
          fi
          echo "App Store Connect OK — '$(jq -r '.data[0].attributes.name' /tmp/asc.json)' ($BUNDLE_ID)."

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild archive \
            -workspace Mooligan.xcworkspace \
            -scheme Mooligan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mooligan.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"

      # `destination = upload` in the export options makes -exportArchive hand the
      # .ipa straight to App Store Connect — no separate altool step.
      - name: Export & upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Mooligan.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Summary
        if: always()
        run: |
          echo "### TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version **${{ steps.version.outputs.marketing }} (${{ steps.version.outputs.build }})**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcarchive
          path: build/Mooligan.xcarchive
          retention-days: 7
          if-no-files-found: ignore
